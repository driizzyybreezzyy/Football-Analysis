<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Analysis</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        h1 { color: #333; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; max-width: 500px; width: 100%; }
        input[type="file"], input[type="text"] { margin-bottom: 20px; width: 90%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="submit"] { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; box-sizing: border-box; }
        input[type="submit"]:hover { background-color: #0056b3; }
        .divider { margin: 20px 0; font-weight: bold; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analyze a Football Match</h1>
        <form method="post" enctype="multipart/form-data">
            
            <label style="display:block; text-align:left; margin-bottom:5px; font-weight:bold;">1. Paste a YouTube URL</label>
            <input type="text" name="youtube_url" placeholder="https://www.youtube.com/watch?v=...">
            
            <div class="divider">OR</div>
            
            <label style="display:block; text-align:left; margin-bottom:5px; font-weight:bold;">2. Upload a Video File</label>
            <input type="file" name="video" accept="video/mp4,video/avi,video/quicktime">
            
            <br><br>
            <input type="submit" value="Start Analysis">
        </form>
    </div>
</body>
</html>
