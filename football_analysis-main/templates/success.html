<!-- templates/success.html -->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Success!</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; max-width: 800px; width: 100%; }
        h1 { color: #28a745; } 
        p { color: #333; font-size: 18px; line-height: 1.6; } 
        .video-wrapper { margin-top: 20px; text-align: center; }
        video { max-width: 100%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .btn-group { margin-top: 30px; display: flex; justify-content: center; gap: 15px; }
        a.btn { text-decoration: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; }
        a.btn-primary { background-color: #007bff; color: white; }
        a.btn-primary:hover { background-color: #0056b3; }
        a.btn-secondary { background-color: #6c757d; color: white; border: 1px solid #6c757d; }
        a.btn-secondary:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Success! Analysis Complete.</h1>
        <p>Your match has been fully tracked and analyzed.</p>
        
        <div class="video-wrapper">
            <video controls autoplay muted>
                <source src="/static/output_videos/{{ output_filename }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="btn-group">
            <a href="/static/output_videos/{{ csv_filename }}" class="btn btn-secondary" download>Download CSV Stats</a>
            <a href="/" class="btn btn-primary">Analyze Another Match</a>
        </div>
    </div>
</body>
</html>
