<!-- templates/poll.html -->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Video...</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        .spinner {
            border: 8px solid #f3f3f3; border-top: 8px solid #007bff; border-radius: 50%;
            width: 50px; height: 50px; animation: spin 2s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #error-msg { color: red; display: none; margin-top: 20px; white-space: pre-wrap; text-align: left; background: #ffe6e6; padding: 10px; border-radius: 4px; border: 1px solid red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Processing your match...</h1>
        <p>This may take several minutes depending on the length of the video.</p>
        <div class="spinner" id="spinner"></div>
        <p id="status-text">Downloading and analyzing...</p>
        <div id="error-msg"></div>
    </div>

    <script>
        const jobId = "{{ job_id }}";
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const errorMsg = document.getElementById('error-msg');

        function checkStatus() {
            fetch(`/status/${jobId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'completed') {
                        statusText.innerText = "Complete! Redirecting...";
                        window.location.href = `/success/${jobId}`;
                    } else if (data.status === 'error') {
                        spinner.style.display = 'none';
                        statusText.innerText = "An error occurred during processing.";
                        errorMsg.style.display = 'block';
                        errorMsg.innerText = data.error_message;
                    } else {
                        // Still processing, check again in 3 seconds
                        setTimeout(checkStatus, 3000);
                    }
                })
                .catch(error => {
                    console.error('Error fetching status:', error);
                    setTimeout(checkStatus, 5000); // Retry on network error
                });
        }

        // Start checking 
        checkStatus();
    </script>
</body>
</html>
